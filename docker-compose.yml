services:
  db:
    image: postgres:16-alpine
    container_name: procurement_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-procurement}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-procurement}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - procurement_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procurement_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-procurement}}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-30}
      DB_MAX_RETRIES: ${DB_MAX_RETRIES:-30}
      DB_RETRY_INTERVAL: ${DB_RETRY_INTERVAL:-2}
      PORT: 8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - procurement_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
    container_name: procurement_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000/api/v1}
      SERVER_API_URL: ${SERVER_API_URL:-http://backend:8000/api/v1}
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - procurement_network

networks:
  procurement_network:
    driver: bridge
    name: procurement_network

volumes:
  postgres_data:
    name: procurement_postgres_data
  backend_logs:
    name: procurement_backend_logs
